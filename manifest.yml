modules:
  jira:issuePanel:
    - key: verdict-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: Verdict
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/633dd1a4-0517-4b9a-9f2d-43aaf4e17d3e
